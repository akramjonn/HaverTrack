name: Nutrislice Menu Sync

on:
  schedule:
    # 3x daily in UTC:
    # 09:30 UTC = 5:30 AM ET (Before breakfast)
    # 15:00 UTC = 11:00 AM ET (Before lunch)
    # 20:30 UTC = 4:30 PM ET (Before dinner)
    - cron: '30 9,15,20 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  sync-menus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Nutrislice sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: npx tsx scripts/sync-nutrislice.ts

      - name: Commit cached menu data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/menus/latest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(menu): sync live Nutrislice DC menu [skip ci]" && git push)
