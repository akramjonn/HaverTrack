name: Nutrislice Menu Sync

on:
  schedule:
    # Cron is always UTC. These times land before each meal in both EST and EDT.
    # GitHub's hosted schedule is best-effort, so the sync itself is idempotent.
    - cron: '30 9,15,20 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: menu-sync
  cancel-in-progress: false

jobs:
  sync-menus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Nutrislice sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: npm run sync:menus

      - name: Commit cached menu data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- src/data/menus/latest.json; then
            echo "No menu changes to commit."
            exit 0
          fi

          git add src/data/menus/latest.json
          git commit -m "chore(menu): sync live Nutrislice DC menu [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
